<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valle de México — Mapa interactivo</title>

  <!-- Leaflet: librería gratuita de mapas (sin marcas de agua) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1c2b33;
    }
    header {
      padding: 1rem 1.25rem;
      background: #0b3d2e;
      color: #fff;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p { font-size: .85rem; opacity: .8; margin-top: .15rem; }
    #map { height: calc(100vh - 84px); }
    .footer-note {
      padding: .4rem 1.25rem;
      font-size: .75rem;
      color: #5c6b73;
      background: #e9eef1;
    }
  </style>
</head>
<body>

  <header>
    <h1>🗺️ Valle de México — Prototipo académico</h1>
    <p>Mapa interactivo con puntos de interés · Leaflet + OpenStreetMap</p>
  </header>

  <div id="map"></div>

  <div class="footer-note">
    Proyecto académico — prototipo. Mapa base © colaboradores de OpenStreetMap.
  </div>

  <script>
    // 1. Mapa centrado en el Valle de México
    const map = L.map('map').setView([19.45, -99.10], 9);

    // 2. Mapa base de OpenStreetMap (gratuito, sin API key ni marca de agua)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. Contorno aproximado del Valle de México
    const contornoValle = [
      [19.98, -99.55], [19.85, -99.00], [19.75, -98.75],
      [19.45, -98.65], [19.15, -98.75], [19.02, -99.15],
      [19.05, -99.55], [19.25, -99.80], [19.60, -99.85],
      [19.98, -99.55]
    ];
    L.polygon(contornoValle, {
      color: '#0b3d2e',
      weight: 2,
      dashArray: '6 6',
      fillColor: '#2e8b57',
      fillOpacity: 0.08
    }).addTo(map).bindPopup('Cuenca del Valle de México');

    // 4. Puntos de interés
    const puntos = [
      {
        coords: [19.4326, -99.1332],
        titulo: 'Ciudad de México',
        desc: 'Capital del país. Fundada sobre el lago de Texcoco por los mexicas en 1325.'
      },
      {
        coords: [19.495, -98.842],
        titulo: 'Zona arqueológica de Teotihuacán',
        desc: 'Gran ciudad prehispánica; Pirámides del Sol y de la Luna.'
      },
      {
        coords: [19.6925, -98.8438],
        titulo: 'Volcán Teotihuacán / Sierra de Patlachique',
        desc: 'Límite noreste de la cuenca.'
      },
      {
        coords: [19.0785, -98.6275],
        titulo: 'Volcán Popocatépetl',
        desc: 'Volcán activo (5,426 m s. n. m.) en el límite sureste del valle.'
      },
      {
        coords: [19.1794, -98.6414],
        titulo: 'Volcán Iztaccíhuatl',
        desc: 'Volcán inactivo (5,230 m s. n. m.), conocido como "La Mujer Dormida".'
      },
      {
        coords: [19.2833, -99.5500],
        titulo: 'Lerma',
        desc: 'Vado de carretas y nodo histórico en el poniente de la cuenca.'
      },
      {
        coords: [19.2925, -99.6569],
        titulo: 'Nevado de Toluca',
        desc: 'Límite suroeste del valle; cráter con lagunas del Sol y la Luna.'
      },
      {
        coords: [19.49, -99.20],
        titulo: 'Zona metropolitana del norte',
        desc: 'Ecatepec, Coacalco, Tultitlán; parte de la expansión urbana.'
      }
    ];

    puntos.forEach(p => {
      L.marker(p.coords)
        .addTo(map)
        .bindPopup(`<b>${p.titulo}</b><br>${p.desc}`);
    });

    // 5. Ajustar el mapa para ver todo el contorno
    map.fitBounds(L.latLngBounds(contornoValle).pad(0.15));
  </script>

</body>
</html>

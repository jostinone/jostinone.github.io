<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenca de México — Los cinco lagos (prototipo funcional)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f1ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: .75rem;
    }
    #estado {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: .6rem 1rem;
      font-size: .95rem;
      min-width: 320px;
      text-align: center;
    }
    #mapa { width: min(90vw, 600px); background: #efe9dd; border: 1px solid #bbb; }
    svg { width: 100%; height: auto; display: block; }

    /* Cama de lago seca (el fondo del lago) */
    .cama { fill: #d8cdb4; stroke: #9c8f72; stroke-width: 1.5; }
    /* Agua: sube con cada clic */
    .agua { fill: #3d8fb1; transition: y .4s ease, height .4s ease; }
    /* Lago ya lleno: se vuelve clicable "inerte" */
    .lleno { cursor: default; }
    .lago { cursor: pointer; }
    .lago:hover .cama { stroke: #3d8fb1; }
    /* Nombre del lago (oculto hasta llenarse) */
    .nombre-lago { opacity: 0; transition: opacity .6s ease; font-size: 22px; font-weight: 600; fill: #ffffff; paint-order: stroke; stroke: #1d3f52; stroke-width: 3px; pointer-events: none; }
    .nombre-lago.visible { opacity: 1; }
    /* Ciudades 1519 */
    .ciudad { opacity: 0; transition: opacity .7s ease; }
    .ciudad.visible { opacity: 1; }
    .ciudad text { font-size: 17px; fill: #3a2f1d; paint-order: stroke; stroke: #f4f1ea; stroke-width: 3px; }
    .ciudad circle { fill: #3a2f1d; }
    .estrella { fill: #b3261e; }
    #titulo-final { opacity: 0; transition: opacity 1s ease; font-size: 26px; font-weight: 700; fill: #1d3f52; text-anchor: middle; }
    #titulo-final.visible { opacity: 1; }
    #reset {
      padding: .45rem 1.1rem; border: 1px solid #999; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: .9rem;
    }
  </style>
</head>
<body>

  <div id="estado">Haz clic en un lago para llenarlo de agua. <span id="detalle">Nivel inicial: cada lago está casi seco.</span></div>

  <div id="mapa">
  <svg viewBox="0 0 820 1010" xmlns="http://www.w3.org/2000/svg">

    <!-- ==================== LAGOS (orden: norte → sur) ==================== -->

    <!-- Lago de Zumpango -->
    <g class="lago" data-lago="Zumpango" transform="translate(0,0)">
      <clipPath id="clip-zumpango"><path d="M250,60 C300,20 420,15 480,45 C560,60 610,110 615,170 C620,230 580,280 520,295 C460,310 380,305 330,285 C270,260 240,210 235,155 C230,110 220,85 250,60 Z"/></clipPath>
      <path class="cama" d="M250,60 C300,20 420,15 480,45 C560,60 610,110 615,170 C620,230 580,280 520,295 C460,310 380,305 330,285 C270,260 240,210 235,155 C230,110 220,85 250,60 Z"/>
      <g clip-path="url(#clip-zumpango)"><rect class="agua" x="235" y="295" width="380" height="0"/></g>
      <text class="nombre-lago" x="400" y="165" text-anchor="middle">Lago de Zumpango</text>
    </g>

    <!-- Lago de Xaltocan -->
    <g class="lago" data-lago="Xaltocan">
      <clipPath id="clip-xaltocan"><path d="M460,290 C520,270 600,285 630,330 C655,375 640,420 595,440 C545,460 480,450 450,415 C425,385 420,340 460,290 Z"/></clipPath>
      <path class="cama" d="M460,290 C520,270 600,285 630,330 C655,375 640,420 595,440 C545,460 480,450 450,415 C425,385 420,340 460,290 Z"/>
      <g clip-path="url(#clip-xaltocan)"><rect class="agua" x="450" y="440" width="185" height="0"/></g>
      <text class="nombre-lago" x="540" y="365" text-anchor="middle">Lago de Xaltocan</text>
    </g>

    <!-- Lago de Texcoco -->
    <g class="lago" data-lago="Texcoco">
      <clipPath id="clip-texcoco"><path d="M400,420 C480,400 620,420 680,480 C730,530 745,620 720,690 C690,760 600,790 520,775 C450,762 400,720 385,650 C372,590 360,500 400,420 Z"/></clipPath>
      <path class="cama" d="M400,420 C480,400 620,420 680,480 C730,530 745,620 720,690 C690,760 600,790 520,775 C450,762 400,720 385,650 C372,590 360,500 400,420 Z"/>
      <g clip-path="url(#clip-texcoco)"><rect class="agua" x="385" y="775" width="345" height="0"/></g>
      <text class="nombre-lago" x="560" y="600" text-anchor="middle">Lago de Texcoco</text>
    </g>

    <!-- Lago de Xochimilco -->
    <g class="lago" data-lago="Xochimilco">
      <clipPath id="clip-xochimilco"><path d="M280,760 C340,745 420,750 460,790 C490,825 480,870 430,890 C380,908 310,900 275,865 C245,835 245,790 280,760 Z"/></clipPath>
      <path class="cama" d="M280,760 C340,745 420,750 460,790 C490,825 480,870 430,890 C380,908 310,900 275,865 C245,835 245,790 280,760 Z"/>
      <g clip-path="url(#clip-xochimilco)"><rect class="agua" x="245" y="890" width="230" height="0"/></g>
      <text class="nombre-lago" x="355" y="830" text-anchor="middle">Lago de Xochimilco</text>
    </g>

    <!-- Lago de Chalco -->
    <g class="lago" data-lago="Chalco">
      <clipPath id="clip-chalco"><path d="M480,830 C540,815 640,820 700,855 C745,882 745,925 700,945 C640,968 540,960 495,925 C460,897 455,860 480,830 Z"/></clipPath>
      <path class="cama" d="M480,830 C540,815 640,820 700,855 C745,882 745,925 700,945 C640,968 540,960 495,925 C460,897 455,860 480,830 Z"/>
      <g clip-path="url(#clip-chalco)"><rect class="agua" x="455" y="945" width="260" height="0"/></g>
      <text class="nombre-lago" x="590" y="895" text-anchor="middle">Lago de Chalco</text>
    </g>

    <!-- ==================== UNIÓN DE LOS CINCO LAGOS ==================== -->
    <text id="titulo-final" x="410" y="40">Los cinco lagos se unen: la cuenca de México</text>

    <!-- ==================== CIUDADES 1519 (ocultas hasta la unión) ==================== -->
    <g id="ciudades">
      <g class="ciudad" style="transition-delay:.2s">
        <text x="735" y="225" text-anchor="end">Teotihuacan</text>
        <circle cx="760" cy="220" r="4"/>
      </g>
      <g class="ciudad" style="transition-delay:.5s">
        <text x="150" y="495" text-anchor="middle">Azcapotzalco</text>
        <circle cx="180" cy="490" r="4"/>
      </g>
      <g class="ciudad" style="transition-delay:.8s">
        <text x="190" y="555" text-anchor="middle">Tlacopan</text>
        <circle cx="225" cy="550" r="4"/>
      </g>
      <g class="ciudad" style="transition-delay:1.1s">
        <polygon class="estrella" points="345,585 350,597 363,597 352,605 357,618 345,610 333,618 338,605 327,597 340,597"/>
        <text x="345" y="645" text-anchor="middle" style="font-weight:700">Tenochtitlan</text>
      </g>
      <g class="ciudad" style="transition-delay:1.4s">
        <text x="775" y="470" text-anchor="middle">Texcoco</text>
        <circle cx="735" cy="465" r="4"/>
      </g>
      <g class="ciudad" style="transition-delay:1.7s">
        <text x="400" y="740" text-anchor="middle">Culhuacan</text>
        <circle cx="405" cy="715" r="4"/>
      </g>
      <g class="ciudad" style="transition-delay:2s">
        <text x="270" y="935" text-anchor="middle">Xochimilco</text>
        <circle cx="315" cy="920" r="4"/>
      </g>
      <g class="ciudad" style="transition-delay:2.3s">
        <text x="740" y="995" text-anchor="middle">Chalco</text>
        <circle cx="705" cy="968" r="4"/>
      </g>
    </g>
  </svg>
  </div>

  <button id="reset">Reiniciar</button>

  <script>
    const INCREMENTO = 20;          // % de agua por clic (5 clics llenan un lago)
    const estadoEl = document.getElementById('estado');
    const detalleEl = document.getElementById('detalle');
    let lagosCompletos = 0;
    let unidos = false;

    document.querySelectorAll('.lago').forEach(grupo => {
      const nombre = grupo.dataset.lago;
      const agua = grupo.querySelector('.agua');
      const nombreEl = grupo.querySelector('.nombre-lago');
      let nivel = 0;

      // El rect de agua empieza con height=0 y su "y" en la base del lago;
      // al subir el nivel, crece hacia arriba (y disminuye, height aumenta).
      const fullY = parseFloat(agua.getAttribute('y'));
      const cama = grupo.querySelector('.cama');
      const b = cama.getBBox();
      const altoTotal = b.height;

      grupo.addEventListener('click', () => {
        if (nivel >= 100 || unidos) return;

        nivel = Math.min(100, nivel + INCREMENTO);
        const h = (nivel / 100) * altoTotal;
        agua.style.height = h + 'px';
        agua.style.y = (fullY - h) + 'px';

        if (nivel >= 100) {
          grupo.classList.add('lleno');
          nombreEl.classList.add('visible');
          lagosCompletos++;
          detalleEl.textContent = `¡El lago de ${nombre} está lleno! (${lagosCompletos}/5)`;
          if (lagosCompletos === 5) unirLagos();
        } else {
          detalleEl.textContent = `Lago de ${nombre}: ${nivel} % lleno.`;
        }
      });
    });

    function unirLagos() {
      unidos = true;
      detalleEl.textContent = 'Los cinco lagos se unen: la cuenca se llena.';
      document.getElementById('titulo-final').classList.add('visible');
      // Revelar ciudades una por una (usando los delays de CSS)
      document.querySelectorAll('.ciudad').forEach(c => c.classList.add('visible'));
      setTimeout(() => {
        detalleEl.textContent = 'El Valle de México, 1519: ciudades alrededor de la gran laguna.';
      }, 2500);
    }

    document.getElementById('reset').addEventListener('click', () => location.reload());
  </script>

</body>
</html>
